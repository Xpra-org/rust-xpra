name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Build libjpeg-turbo from turbojpeg-sys' vendored copy: the runners have no
  # libturbojpeg >= 3.0 (and Windows has no pkg-config at all). Set in the process
  # environment so it wins over the `[env]` block in .cargo/config.toml.
  TURBOJPEG_SOURCE: vendor

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          nasm \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libwayland-dev
    - name: Build
      run: cargo build --verbose
