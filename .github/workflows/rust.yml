name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Build libjpeg-turbo from turbojpeg-sys' vendored copy: the runners have no
  # libturbojpeg >= 3.0 (and Windows has no pkg-config at all). Set in the process
  # environment so it wins over the `[env]` block in .cargo/config.toml.
  TURBOJPEG_SOURCE: vendor

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    # the ssh-native transport exists for Windows workstations with no OpenSSH client, so it has
    # to keep building here even though its own tests need a Unix sshd (see the job below)
    - name: Build with the native ssh transport
      run: cargo build --features ssh-native --verbose

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          nasm \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libwayland-dev
    - name: Build
      run: cargo build --verbose

  ssh-native:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y           nasm           cmake           pkg-config           libx11-dev           libxrandr-dev           libxi-dev           libxcursor-dev           libxkbcommon-dev           libwayland-dev           openssh-server
    - name: Build
      run: cargo build --features ssh-native --verbose
    # tests/ssh.rs starts its own sshd on a free port and connects to it through the transport:
    # authentication, the host-key check, the remote command and both directions of the stream.
    - name: Test against a local sshd
      run: cargo test --features ssh-native -- --include-ignored --nocapture
