name: Release

on:
  push:
    tags:
      - "v*"

env:
  # Build libjpeg-turbo from turbojpeg-sys' vendored copy: the runners have no
  # libturbojpeg >= 3.0 (and Windows has no pkg-config at all). Set in the process
  # environment so it wins over the `[env]` block in .cargo/config.toml.
  TURBOJPEG_SOURCE: vendor

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install upx
      run: choco install upx -y
    - name: Build
      run: cargo build --release --verbose
    - name: Compress
      run: upx --best --lzma target\release\xpra.exe
    - name: Package
      run: |
        mkdir dist
        copy target\release\xpra.exe dist\xpra-windows-x86_64.exe
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-windows-x86_64
        path: dist/xpra-windows-x86_64.exe

  build-windows-arm64:

    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v4
    - name: Install upx
      run: choco install upx -y
    - name: Build
      run: cargo build --release --verbose
    - name: Compress
      run: upx --best --lzma target\release\xpra.exe
    - name: Package
      run: |
        mkdir dist
        copy target\release\xpra.exe dist\xpra-windows-arm64.exe
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-windows-arm64
        path: dist/xpra-windows-arm64.exe

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          nasm \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libwayland-dev \
          upx-ucl
    - name: Build
      run: cargo build --release --verbose
    - name: Compress
      run: upx --best --lzma ./target/release/xpra
    - name: Package
      run: |
        mkdir dist
        cp target/release/xpra dist/xpra-linux-x86_64
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-linux-x86_64
        path: dist/xpra-linux-x86_64

  build-linux-arm64:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          nasm \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libwayland-dev \
          upx-ucl
    - name: Build
      run: cargo build --release --verbose
    - name: Compress
      run: upx --best --lzma ./target/release/xpra
    - name: Package
      run: |
        mkdir dist
        cp target/release/xpra dist/xpra-linux-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-linux-arm64
        path: dist/xpra-linux-arm64

  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: brew install pkg-config upx
    - name: Build
      run: cargo build --release --verbose
    - name: Compress
      run: upx --best --lzma ./target/release/xpra
    - name: Package
      run: |
        mkdir dist
        cp target/release/xpra dist/xpra-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-macos-arm64
        path: dist/xpra-macos-arm64

  release:

    needs: [build-windows, build-windows-arm64, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" \
          dist/xpra-windows-x86_64/xpra-windows-x86_64.exe \
          dist/xpra-windows-arm64/xpra-windows-arm64.exe \
          dist/xpra-linux-x86_64/xpra-linux-x86_64 \
          dist/xpra-linux-arm64/xpra-linux-arm64 \
          dist/xpra-macos-arm64/xpra-macos-arm64 \
          --repo "${{ github.repository }}" \
          --title "${{ github.ref_name }}" \
          --generate-notes
