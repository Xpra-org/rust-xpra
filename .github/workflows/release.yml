name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --verbose
    - name: Package
      run: |
        mkdir dist
        copy target\release\xpra.exe dist\xpra-windows-x86_64.exe
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-windows-x86_64
        path: dist/xpra-windows-x86_64.exe

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          nasm \
          pkg-config \
          libjpeg-turbo8-dev \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libwayland-dev
    - name: Build
      run: cargo build --release --verbose
    - name: Package
      run: |
        mkdir dist
        cp target/release/xpra dist/xpra-linux-x86_64
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-linux-x86_64
        path: dist/xpra-linux-x86_64

  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: brew install pkg-config jpeg-turbo
    - name: Build
      run: cargo build --release --verbose
    - name: Package
      run: |
        mkdir dist
        cp target/release/xpra dist/xpra-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: xpra-macos-arm64
        path: dist/xpra-macos-arm64

  release:

    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" \
          dist/xpra-windows-x86_64/xpra-windows-x86_64.exe \
          dist/xpra-linux-x86_64/xpra-linux-x86_64 \
          dist/xpra-macos-arm64/xpra-macos-arm64 \
          --repo "${{ github.repository }}" \
          --title "${{ github.ref_name }}" \
          --generate-notes
