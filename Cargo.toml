[package]
name = "xpra"
version = "0.2.0"
edition = "2024"

[dependencies]
serde_json = "1.0.140"
yaml-rust2 = "0.11.0"
log = { version = "0.4.27", features = ["max_level_trace", "release_max_level_info"] }
simple_logger = "5.0.0"
winit = "0.30"
softbuffer = "0.4"
turbojpeg = { version = "1.3.2" }
spng = { version = "0.2.0-alpha.3" }
base64 = "0.22.1"
machine-uid = "0.6.0"
native-tls = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
