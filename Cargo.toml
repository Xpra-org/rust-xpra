[package]
name = "xpra"
version = "0.3.1"
edition = "2024"

[dependencies]
serde_json = "1.0.140"
yaml-rust2 = "0.11.0"
# `std` was previously enabled for us by `simple_logger`; `set_boxed_logger` is gated on it.
log = { version = "0.4.27", features = ["std", "max_level_trace", "release_max_level_info"] }
winit = "0.30"
softbuffer = "0.4"
turbojpeg = { version = "1.3.2" }
spng = { version = "0.2.0-alpha.3" }
base64 = "0.22.1"
machine-uid = "0.6.0"
native-tls = "0.2"
# lz4 packet decompression (pure-Rust, no C toolchain). We only use the block format with a
# little-endian size prefix - xpra's exact lz4 wire format - so the `frame` default feature (and
# its extra xxhash dependency) is turned off; `safe-decode` keeps decoding memory-safe on the
# adversarial input a network peer can send.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
# webp decoding. By default this builds the vendored libwebp C sources with `cc` (no cmake / nasm /
# bindgen needed) and links them statically, which is what the CI release binaries want.
# See the `webp-dylib` feature below for the shared-library build downstream packagers want.
libwebp-sys = "0.14"
# plain-text clipboard access (get/set the OS clipboard). Text-only, so - unlike arboard's default
# features - it pulls in no image codecs. We take only the `x11` backend (not `wayland`): its
# x11-clipboard is a thin wrapper over the very same x11rb winit + softbuffer already link, so it
# adds almost nothing, whereas copypasta's wayland backend would pull a second copy of
# smithay-client-toolkit / calloop (winit already links its own). On a Wayland session the X11
# clipboard still works through XWayland (present in practice); on Windows the `x11` feature is a
# no-op and copypasta uses the OS clipboard directly. See src/client/clipboard.rs.
copypasta = { version = "0.10", default-features = false, features = ["x11"] }

[features]
default = []
# Link against the system libwebp shared library (found via pkg-config) instead of building and
# statically linking the vendored copy: `cargo build --release --features webp-dylib`.
# Distro packages generally must not vendor a copy of a library that the distro already ships and
# has to be able to patch for CVEs. The FFI surface is identical either way, so nothing outside of
# this file changes.
webp-dylib = ["libwebp-sys/system-dylib"]

# Windows-only: H.264 video decode via Media Foundation (see src/client/mediafoundation.rs) and the
# system tray icon (see src/client/tray.rs). Both live in the OS; this only pulls in the thin
# COM/MF/Win32 bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security_Cryptography",
    # system tray: Shell_NotifyIconW + NOTIFYICONDATAW / the hidden window, popup menu and icon
    # loading it needs / GetModuleHandleW for the module the icon resource lives in. Gdi is not
    # used directly - `WNDCLASSW` and `RegisterClassW` are gated on it because the class struct
    # carries an `HBRUSH` background and an `HCURSOR`.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    # the logger enables ANSI escape processing on the console (see remote_logging.rs)
    "Win32_System_Console",
] }

# Embeds the application icon and the DPI manifest into the .exe (see build.rs). Build-time only -
# pure Rust, and nothing of it is linked into the binary. Not restricted to `cfg(windows)` because
# Cargo resolves target-specific build-dependencies against the *host*, which would break a
# Linux -> Windows cross build; build.rs checks the real target itself.
[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
